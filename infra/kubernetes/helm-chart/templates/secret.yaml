apiVersion: v1
kind: Secret
metadata:
  name: {{ include "irl-quest.fullname" . }}-secrets
  labels:
    {{- include "irl-quest.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default (randAlphaNum 64) | b64enc | quote }}
  {{- if .Values.secrets.googleClientId }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.appleClientId }}
  APPLE_CLIENT_ID: {{ .Values.secrets.appleClientId | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.appleClientSecret }}
  APPLE_CLIENT_SECRET: {{ .Values.secrets.appleClientSecret | b64enc | quote }}
  {{- end }}

