# Правила алертов для IRL Quest
groups:
  - name: irl_quest_alerts
    interval: 30s
    rules:
      # Высокая нагрузка на сервер
      - alert: HighServerLoad
        expr: rate(http_requests_total[5m]) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Высокая нагрузка на сервер"
          description: "Сервер обрабатывает более 1000 req/s"

      # Много ошибок
      - alert: HighErrorRate
        expr: rate(http_requests_errors_total[5m]) > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Высокий уровень ошибок"
          description: "Более 10 ошибок в секунду"

      # PostgreSQL недоступен
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL недоступен"
          description: "База данных не отвечает"

      # Redis недоступен
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis недоступен"
          description: "Кэш не работает"

      # Мало места на диске
      - alert: LowDiskSpace
        expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Мало места на диске"
          description: "Осталось менее 10% свободного места"

